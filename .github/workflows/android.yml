name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Build projector and tablet APKs
        run: gradle --no-daemon :apps:toss-home:assembleDebug :apps:toss-control:assembleDebug
      - name: Upload TOSS Home APK
        uses: actions/upload-artifact@v4
        with:
          name: toss-home-debug
          path: apps/toss-home/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload TOSS Control APK
        uses: actions/upload-artifact@v4
        with:
          name: toss-control-debug
          path: apps/toss-control/build/outputs/apk/debug/*.apk
          if-no-files-found: error
